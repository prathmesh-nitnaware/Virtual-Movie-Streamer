<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#141726" />
      <stop offset="100%" stop-color="#0a0c14" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Behind Logo -->
  <circle cx="600" cy="220" r="140" fill="#4f46e5" opacity="0.15" />

  <!-- WatchVerse Emblem (160x160) -->
  <g transform="translate(520, 140)">
    <rect width="160" height="160" rx="36" fill="#090b13" />
    <rect x="3" y="3" width="154" height="154" rx="33" stroke="#4f46e5" stroke-width="6" stroke-opacity="0.9" />

    <!-- Stylized W Mesh -->
    <path 
      d="M32 48 L54 112 L80 72 L106 112 L128 48" 
      stroke="#818cf8" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Synchronized Cinema Play Core Triangle -->
    <polygon points="72,66 102,86 72,106" fill="#ffffff" />

    <!-- Live Sync Beacon -->
    <circle cx="80" cy="42" r="9" fill="#6366f1" />
    <circle cx="80" cy="42" r="4" fill="#ffffff" />
  </g>

  <!-- Title & Tagline -->
  <text x="600" y="375" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    Watch<tspan fill="#818cf8">Verse</tspan>
  </text>
  <text x="600" y="435" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="-0.2">
    Watch together. Anywhere.
  </text>

  <!-- Feature Highlights Bar -->
  <g transform="translate(300, 500)">
    <rect width="600" height="50" rx="12" fill="#141726" stroke="#24293e" />
    <text x="300" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#c4b5fd" text-anchor="middle">
      Millisecond Video Sync • WebRTC Mesh • Reactions • Live Chat
    </text>
  </g>
</svg>

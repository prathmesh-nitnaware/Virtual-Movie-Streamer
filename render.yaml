services:
  # Backend API & Socket Service
  - type: web
    name: virtual-movie-streamer-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://virtual-movie-streamer.vercel.app,http://localhost:5173

  # Frontend Static Site (Optional alternative to Vercel)
  - type: static
    name: virtual-movie-streamer-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SOCKET_URL
        fromService:
          name: virtual-movie-streamer-api
          type: web
          property: host
